<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOLDWIND — a paper storm arcade</title>
<meta name="description" content="One crane, one fan, six waves of paper beasts. An original arcade shooter that runs offline in the browser.">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #14182a;
    background-image:
      radial-gradient(circle at 50% 42%, #262d47 0%, #14182a 62%, #0e1120 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    display: grid;
    place-items: center;
  }
  #stage {
    position: relative;
    width: min(100vw, 150vh);
    aspect-ratio: 3 / 2;
    box-shadow:
      0 0 0 1px rgba(243, 229, 200, 0.14),
      0 24px 70px rgba(0, 0, 0, 0.55);
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line a screen reader announces. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  #hint {
    position: absolute;
    left: 50%;
    bottom: -1.9rem;
    transform: translateX(-50%);
    color: rgba(243, 229, 200, 0.4);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
    user-select: none;
  }
</style>
</head>
<body>
<main id="stage">
  <canvas id="game" width="960" height="640" aria-label="FOLDWIND: fly the paper crane with the arrow keys or mouse, press space to open the fan and sweep enemy bullets into homing petals"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <span id="hint">arrows / wasd · mouse — space / click · m mute · p pause</span>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
